[package]
name = "simple-ssh-cli"
version = "0.1.0"
edition = "2024"
description = "Kommandozeilenprogramm auf Basis von simple-ssh-lib: exec, Shell, SFTP und ein Selbsttest gegen echte SSH-Server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andie2302/simple-ssh-cli"
readme = "README.md"
keywords = ["ssh", "sftp", "cli", "client"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["/.github"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
simple-ssh-lib = { git = "https://github.com/Andie2302/simple-ssh-lib", rev = "3eb5cf9187c537a1acba45bd4920cf61ef737fc0", version = "0.1.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "io-std", "signal"] }
zeroize = "1.9.1"

# Kryptografie-Crates auch im Debug-Build optimieren, damit Tests nicht unnötig langsam sind.
[profile.dev.package."*"]
opt-level = 3
