name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Bauen
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Paket schnüren
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          dir="simple-ssh-cli-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/simple-ssh-cli" LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          if command -v sha256sum >/dev/null; then sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"; else shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"; fi
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Binaries für Linux x86_64 und macOS arm64 mit SHA256-Summen. Siehe CHANGELOG.md."
